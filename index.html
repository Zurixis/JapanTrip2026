<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>阿波土佐街道 — Sykkeltur Tokushima ↔ Kochi</title>
  <meta name="description" content="Personleg reiseassistent for sykkeltur Osaka–Tokushima–Kochi–Osaka" />

  <!-- PWA / installability -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#12283F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Shikoku Rundt" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" href="./icons/icon-192.png" />

  <!-- Fonts (same as in-app, loaded early to avoid flash) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Work+Sans:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet" />

  <!-- Tailwind (play CDN — same utility classes the app already uses) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body { margin: 0; padding: 0; background: #F4EFE3; height: 100%; }
    #root { min-height: 100vh; }
    /* iOS safe-area padding when installed full-screen */
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module" src="./app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
